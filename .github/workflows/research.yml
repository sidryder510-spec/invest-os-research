# Runs the research pipeline on real NSE data and commits the reports back to the branch it ran on.
# Manual only: Actions tab -> research -> Run workflow (or dispatched by Claude via the API).
name: research
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  studies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - name: Offline tests
        run: python -m unittest discover tests
      - name: Build trade dump (downloads Nifty 500 history)
        run: python -c "import historical_backtest_v3 as e; e.export_trade_dump()"
      - name: Studies 00, 01, 02, 05, 06
        run: |
          for s in 00_engine_validation 01_eligibility 02_concentration 05_transaction_costs 06_walk_forward; do
            python study_$s.py
          done
      - name: Survivorship check (informational)
        run: python survivorship_check.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f research trade_dump.csv data/universe_nifty500.csv 2>/dev/null || true
          git commit -m "Research results from run ${{ github.run_id }} on ${{ github.sha }}" || exit 0
          git push origin HEAD:${{ github.ref_name }}
