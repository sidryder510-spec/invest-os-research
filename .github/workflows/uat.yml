# UAT: replay the weekly paper-trading job over 2023-2024 with the live code to show buy and sell
# triggers firing, then send one "[UAT]" alert issue to check that phone notifications arrive.
# Results go to uat/ and never mix with the real paper record. Manual only.
name: uat
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  uat:
    runs-on: ubuntu-latest
    env:
      WA_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WA_KEY: ${{ secrets.CALLMEBOT_APIKEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python -m unittest tests.test_paper_trade
      - run: python paper_trade.py --uat
      - name: WhatsApp alert (CallMeBot; skipped until the two secrets are set)
        if: hashFiles('paper/alert.md') != '' && env.WA_KEY != ''
        run: >
          curl -fsS -G https://api.callmebot.com/whatsapp.php
          --data-urlencode "phone=$WA_PHONE" --data-urlencode "text@paper/alert.md" --data-urlencode "apikey=$WA_KEY"
          -o /dev/null || echo "WhatsApp send failed; the GitHub issue alert still went out"
      - name: Test alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[UAT] Paper-trading triggers test" --body-file paper/alert.md
      - name: Commit UAT results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add uat
          git commit -m "UAT results from run ${{ github.run_id }}" || exit 0
          git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
